openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Scootware Forum API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: forum
    description: Forum operations
  - name: shoutbox
    description: Shoutbox operations
  - name: admin
    description: Admin operations
  - name: products
    description: Gaming product and access operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered, verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/verify-email:
    get:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email with token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/site-config:
    get:
      operationId: getSiteConfig
      tags: [auth]
      summary: Get public site configuration (invite and registration settings)
      responses:
        "200":
          description: Site configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"

  /auth/request-invite:
    post:
      operationId: requestInvite
      tags: [auth]
      summary: Request an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  inviteCode:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sso/google:
    get:
      operationId: ssoGoogle
      tags: [auth]
      summary: Initiate Google SSO
      responses:
        "302":
          description: Redirect to Google

  /auth/sso/discord:
    get:
      operationId: ssoDiscord
      tags: [auth]
      summary: Initiate Discord SSO
      responses:
        "302":
          description: Redirect to Discord

  /auth/sso/steam:
    get:
      operationId: ssoSteam
      tags: [auth]
      summary: Initiate Steam SSO
      responses:
        "302":
          description: Redirect to Steam

  /auth/sso/pending:
    get:
      operationId: ssoPending
      tags: [auth]
      summary: Get pending SSO session data
      responses:
        "200":
          description: Pending SSO data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoPendingResponse"
        "404":
          description: No pending SSO session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sso/link:
    post:
      operationId: ssoLink
      tags: [auth]
      summary: Link pending SSO to existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoLinkRequest"
      responses:
        "200":
          description: Account linked and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sso/create:
    post:
      operationId: ssoCreate
      tags: [auth]
      summary: Create new account from pending SSO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoCreateRequest"
      responses:
        "200":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user/linked-providers:
    get:
      operationId: getLinkedProviders
      tags: [auth]
      summary: Get linked SSO providers for current user
      responses:
        "200":
          description: List of linked providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedProvidersResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user/link-sso/google:
    get:
      operationId: linkSsoGoogle
      tags: [auth]
      summary: Initiate Google SSO linking for authenticated user
      responses:
        "302":
          description: Redirect to Google OAuth
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user/link-sso/discord:
    get:
      operationId: linkSsoDiscord
      tags: [auth]
      summary: Initiate Discord SSO linking for authenticated user
      responses:
        "302":
          description: Redirect to Discord OAuth
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user/link-sso/steam:
    get:
      operationId: linkSsoSteam
      tags: [auth]
      summary: Initiate Steam SSO linking for authenticated user
      responses:
        "302":
          description: Redirect to Steam OpenID
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user/unlink-sso/{provider}:
    post:
      operationId: unlinkSso
      tags: [auth]
      summary: Unlink SSO provider from authenticated user
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord, steam]
      responses:
        "200":
          description: Provider unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Cannot unlink only auth method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/avatar:
    post:
      operationId: uploadAvatar
      tags: [users]
      summary: Upload user avatar
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/posts:
    get:
      operationId: getUserProfilePosts
      tags: [users]
      summary: Get posts on user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfilePost"
    post:
      operationId: createProfilePost
      tags: [users]
      summary: Post on a user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfilePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePost"

  /users/me/invites:
    get:
      operationId: getMyInvites
      tags: [users]
      summary: Get current user's issued invites and their usage
      responses:
        "200":
          description: User invites data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/request-invite:
    post:
      operationId: requestInviteAuthenticated
      tags: [users]
      summary: Request an invite (authenticated users in invite-only mode)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInviteAuthenticatedRequest"
      responses:
        "200":
          description: Invite request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /forum/categories:
    get:
      operationId: getCategories
      tags: [forum]
      summary: Get forum categories and subforums
      responses:
        "200":
          description: Forum categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /forum/threads:
    get:
      operationId: getThreads
      tags: [forum]
      summary: Get threads in a subforum
      parameters:
        - name: subforumId
          in: query
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Threads list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsResponse"
    post:
      operationId: createThread
      tags: [forum]
      summary: Create a new thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"

  /forum/threads/{threadId}:
    get:
      operationId: getThread
      tags: [forum]
      summary: Get a thread with its posts
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Thread with posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadDetail"

  /forum/subforums/{subforumId}:
    get:
      operationId: getSubforum
      tags: [forum]
      summary: Get a specific subforum with details
      parameters:
        - name: subforumId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subforum details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubforumDetail"

  /forum/posts:
    post:
      operationId: createPost
      tags: [forum]
      summary: Reply to a thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /shoutbox:
    get:
      operationId: getShoutboxMessages
      tags: [shoutbox]
      summary: Get recent shoutbox messages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Shoutbox messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoutboxMessage"
    post:
      operationId: postShoutboxMessage
      tags: [shoutbox]
      summary: Post a shoutbox message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShoutboxMessageRequest"
      responses:
        "201":
          description: Message posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoutboxMessage"

  /shoutbox/{id}:
    delete:
      operationId: deleteShoutboxMessage
      tags: [shoutbox]
      summary: Delete a shoutbox message (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Get available gaming products
      responses:
        "200":
          description: Available upgrades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/purchase:
    post:
      operationId: purchaseProduct
      tags: [products]
      summary: Purchase a gaming product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseProductRequest"
      responses:
        "200":
          description: Payment Intent Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseIntentResponse"

  /products/verify-payment:
    post:
      operationId: verifyPayment
      tags: [products]
      summary: Verify payment completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientSecret:
                  type: string
                productIds:
                  type: array
                  items:
                    type: string
              required: [clientSecret, productIds]
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Get all users (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{userId}/ban:
    post:
      operationId: adminBanUser
      tags: [admin]
      summary: Ban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserRequest"
      responses:
        "200":
          description: User banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users/{userId}/unban:
    post:
      operationId: adminUnbanUser
      tags: [admin]
      summary: Unban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/config:
    get:
      operationId: adminGetConfig
      tags: [admin]
      summary: Get site configuration
      responses:
        "200":
          description: Site config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"
    patch:
      operationId: adminUpdateConfig
      tags: [admin]
      summary: Update site configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteConfig"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [username, email, password]

    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Email address or username
        email:
          type: string
          format: email
        password:
          type: string
      required: [password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required: [user]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        upgradeType:
          type: string
          nullable: true
          enum: [
            BODYCAM_PREMIUM, BODYCAM_LIFETIME,
            RUST_PREMIUM, RUST_LIFETIME,
            DAYZ_PREMIUM, DAYZ_LIFETIME,
            TARKOV_PREMIUM, TARKOV_LIFETIME,
            CS2_PREMIUM, CS2_LIFETIME,
            SPOOFER_PREMIUM, SPOOFER_LIFETIME
          ]
        upgradeExpiresAt:
          type: string
          format: date-time
          nullable: true
        productAccess:
          type: array
          items:
            $ref: "#/components/schemas/UserProductAccess"
          description: List of products the user has access to via invites or purchases
        avatarUrl:
          type: string
          nullable: true
        isBanned:
          type: boolean
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        postCount:
          type: integer
      required: [id, username, email, role, isBanned, isEmailVerified, createdAt, postCount, productAccess]

    UserProductAccess:
      type: object
      properties:
        productId:
          type: string
        expiresAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        recentPosts:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePost"
      required: [user, recentPosts]

    ProfilePost:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        authorId:
          type: integer
        authorUsername:
          type: string
        authorAvatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, content, authorId, authorUsername, createdAt]

    CreateProfilePostRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required: [content]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        productId:
          type: string
          nullable: true
        subforums:
          type: array
          items:
            $ref: "#/components/schemas/Subforum"
      required: [id, name, subforums]

    Subforum:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        threadCount:
          type: integer
        postCount:
          type: integer
        lastPost:
          $ref: "#/components/schemas/LastPost"
          nullable: true
        requiresUpgrade:
          type: boolean
        parentId:
          type: integer
          nullable: true
      required: [id, name, threadCount, postCount, requiresUpgrade]

    SubforumDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        threadCount:
          type: integer
        postCount:
          type: integer
        lastPost:
          $ref: "#/components/schemas/LastPost"
          nullable: true
        requiresUpgrade:
          type: boolean
        parentId:
          type: integer
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        productId:
          type: string
          nullable: true
      required: [id, name, threadCount, postCount, requiresUpgrade]

    LastPost:
      type: object
      properties:
        threadTitle:
          type: string
        username:
          type: string
        createdAt:
