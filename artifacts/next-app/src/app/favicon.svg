<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" fill="#000000"/>
  
  <!-- Outer glow effect -->
  <defs>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glow background -->
  <circle cx="90" cy="90" r="90" fill="url(#glowPurple)"/>
  <circle cx="90" cy="90" r="60" fill="url(#glowCyan)"/>
  
  <!-- S Logo shape - stylized with neon effect -->
  <!-- Upper curve of S -->
  <path d="M 60 50 Q 70 40 85 45 Q 100 50 95 65 L 90 70 Q 85 65 75 62 Q 65 60 60 65 Z" 
        fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Middle section -->
  <path d="M 95 65 Q 110 55 120 70 Q 128 85 110 95 L 115 100 Q 135 85 125 65 Q 112 45 90 55 Z" 
        fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Lower curve of S -->
  <path d="M 110 95 Q 100 105 85 100 Q 70 95 75 80 L 80 85 Q 90 90 100 92 Q 110 94 115 88 Z" 
        fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Bottom curve -->
  <path d="M 75 80 Q 60 75 65 115 Q 70 130 90 135 Q 110 140 120 130 L 115 125 Q 100 132 85 128 Q 70 124 68 110 Z" 
        fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>